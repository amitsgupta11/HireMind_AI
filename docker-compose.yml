version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiremind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiremind
      POSTGRES_PASSWORD: hiremind
      POSTGRES_DB: hiremind_dev
    ports:
      - "5432:5432"
    volumes:
      - hiremind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hiremind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiremind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Runs the resume-processing BullMQ worker as its own container, sharing
  # the same image and .env as the API — mirrors how this splits into two
  # separate services ("web" + "background worker") on Render.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiremind-worker
    restart: unless-stopped
    command: npm run worker:start
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiremind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  hiremind_postgres_data:
